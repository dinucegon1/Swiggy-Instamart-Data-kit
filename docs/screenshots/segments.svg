    <text x="543" y="245" fill="#617086" font-size="14">Avg. recency</text>
    <text x="890" y="245" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">25.1 days</text>
    <text x="543" y="274" fill="#617086" font-size="14">Avg. frequency</text>
    <text x="890" y="274" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">6.8 orders</text>
    <text x="543" y="303" fill="#617086" font-size="14">Avg. monetary</text>
    <text x="890" y="303" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">₹7,130</text>
    <rect x="543" y="319" width="330" height="7" rx="4" fill="#e8eef8"/>
    <rect x="543" y="319" width="330" height="7" rx="4" fill="#7c3aed"/>

    <text x="78" y="406" fill="#059669" font-size="21" font-weight="700">Cluster 2</text>
    <text x="78" y="441" fill="#15243a" font-size="16">419 customers</text>
    <text x="78" y="479" fill="#617086" font-size="14">Avg. recency</text>
    <text x="425" y="479" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">9.8 days</text>
    <text x="78" y="508" fill="#617086" font-size="14">Avg. frequency</text>
    <text x="425" y="508" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">19.4 orders</text>
    <text x="78" y="537" fill="#617086" font-size="14">Avg. monetary</text>
    <text x="425" y="537" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">₹3,410</text>
    <rect x="78" y="553" width="330" height="7" rx="4" fill="#e8eef8"/>
    <rect x="78" y="553" width="158" height="7" rx="4" fill="#059669"/>

    <text x="543" y="406" fill="#ea580c" font-size="21" font-weight="700">Cluster 3</text>
    <text x="543" y="441" fill="#15243a" font-size="16">182 customers</text>
    <text x="543" y="479" fill="#617086" font-size="14">Avg. recency</text>
    <text x="890" y="479" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">110.0 days</text>
    <text x="543" y="508" fill="#617086" font-size="14">Avg. frequency</text>
    <text x="890" y="508" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">2.2 orders</text>
    <text x="543" y="537" fill="#617086" font-size="14">Avg. monetary</text>
    <text x="890" y="537" text-anchor="end" fill="#15243a" font-size="15" font-weight="600">₹686</text>
    <rect x="543" y="553" width="330" height="7" rx="4" fill="#e8eef8"/>
    <rect x="543" y="553" width="32" height="7" rx="4" fill="#ea580c"/>
  </g>
  <text x="54" y="615" fill="#8290a3" font-family="Segoe UI, Arial, sans-serif" font-size="13">Bar length shows average monetary value relative to the highest-spend cluster.</text>
