<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
  <title id="title">Lapse model comparison and holdout metrics</title>
  <desc id="description">Cross-validation F1 scores for Logistic Regression and Random Forest, with holdout metrics for the selected Logistic Regression model.</desc>
  <rect width="1000" height="650" rx="24" fill="#f3f6fb"/>
  <text x="54" y="67" fill="#15243a" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Lapse model evaluation</text>
  <text x="54" y="99" fill="#617086" font-family="Segoe UI, Arial, sans-serif" font-size="16">Stratified holdout · 901 train / 226 test · 19.9% lapse rate</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="50" y="130" width="430" height="235" rx="18" fill="#ffffff"/>
    <text x="80" y="171" fill="#15243a" font-size="19" font-weight="700">Tuned cross-validation F1</text>
    <text x="80" y="215" fill="#617086" font-size="15">Logistic Regression</text>
    <rect x="80" y="230" width="330" height="16" rx="8" fill="#e8eef8"/>
    <rect x="80" y="230" width="281" height="16" rx="8" fill="#2563eb"/>
    <text x="420" y="244" text-anchor="end" fill="#15243a" font-size="14" font-weight="700">0.512</text>
    <text x="80" y="282" fill="#617086" font-size="15">Random Forest</text>
    <rect x="80" y="297" width="330" height="16" rx="8" fill="#e8eef8"/>
    <rect x="80" y="297" width="280" height="16" rx="8" fill="#7c3aed"/>
    <text x="420" y="311" text-anchor="end" fill="#15243a" font-size="14" font-weight="700">0.510</text>
    <text x="80" y="344" fill="#8290a3" font-size="12">Scale: 0 to 0.60 · Grid search optimized F1</text>

    <rect x="510" y="130" width="440" height="235" rx="18" fill="#ffffff"/>
    <text x="540" y="171" fill="#15243a" font-size="19" font-weight="700">Selected model · Logistic Regression</text>
    <rect x="540" y="192" width="180" height="65" rx="12" fill="#eff6ff"/>
    <rect x="740" y="192" width="180" height="65" rx="12" fill="#f5f3ff"/>
    <text x="560" y="219" fill="#617086" font-size="13">Holdout F1 @ 0.50</text>
    <text x="560" y="244" fill="#15243a" font-size="23" font-weight="700">0.506</text>
    <text x="760" y="219" fill="#617086" font-size="13">F1 @ tuned threshold</text>
    <text x="760" y="244" fill="#15243a" font-size="23" font-weight="700">0.503</text>
    <text x="540" y="291" fill="#617086" font-size="14">Accuracy</text>
    <text x="895" y="291" text-anchor="end" fill="#15243a" font-size="14" font-weight="700">0.655</text>
    <text x="540" y="318" fill="#617086" font-size="14">Precision / Recall</text>
    <text x="895" y="318" text-anchor="end" fill="#15243a" font-size="14" font-weight="700">0.354 / 0.889</text>
    <text x="540" y="345" fill="#617086" font-size="14">ROC AUC · selected threshold</text>
    <text x="895" y="345" text-anchor="end" fill="#15243a" font-size="14" font-weight="700">0.747</text>

    <rect x="50" y="390" width="900" height="170" rx="18" fill="#ffffff"/>
    <text x="80" y="432" fill="#15243a" font-size="19" font-weight="700">Why accuracy alone is misleading</text>
    <text x="80" y="470" fill="#617086" font-size="15">Majority-class baseline</text>
    <rect x="280" y="457" width="430" height="18" rx="9" fill="#e8eef8"/>
    <rect x="280" y="457" width="344" height="18" rx="9" fill="#94a3b8"/>
    <text x="735" y="472" fill="#15243a" font-size="14" font-weight="700">80.1% accuracy</text>
    <text x="80" y="515" fill="#617086" font-size="15">Baseline lapse F1</text>
    <rect x="280" y="502" width="430" height="18" rx="9" fill="#e8eef8"/>
    <text x="735" y="517" fill="#15243a" font-size="14" font-weight="700">0.000</text>
    <text x="80" y="543" fill="#8290a3" font-size="12">Tuned threshold 0.482 was selected from out-of-fold training predictions, not the test set.</text>
  </g>
  <text x="54" y="610" fill="#8290a3" font-family="Segoe UI, Arial, sans-serif" font-size="13">Holdout results are dataset-specific; this is a classification problem, so R² is not applicable.</text>
</svg>
